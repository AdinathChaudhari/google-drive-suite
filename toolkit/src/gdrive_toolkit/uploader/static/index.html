<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive Uploader</title>
  <!-- Apply the saved theme before first paint to avoid a flash. Default: dark.
       Stamps data-theme in BOTH directions on purpose: leaving the attribute
       off would let drivedeck.css's prefers-color-scheme fallback win, so this
       app would render light on a light-mode OS despite dark being the
       default. An explicit attribute is what makes the default actually
       dark — and setting it here rather than from app.js is what stops the
       page painting light for a frame first. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) { /* private mode / no storage */ }
      document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
    })();
  </script>
  <link rel="stylesheet" href="/static/drivedeck.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>Drive Uploader</h1>
    <button id="theme-toggle" title="Toggle light / dark theme"
            aria-label="Toggle light / dark theme"><span class="theme-icon">🌙</span></button>
  </header>

  <main>
    <section id="sources-panel">
      <h2>Sources <span id="src-count" class="badge">0</span></h2>
      <div class="pick-buttons">
        <button id="add-files">Add files…</button>
        <button id="add-folders">Add folders…</button>
      </div>
      <ul id="src-list" class="src-list"></ul>
      <p id="src-hint" class="hint">Nothing picked yet.</p>
      <div class="total-row">
        <span>Total</span>
        <span id="src-total">0 B</span>
      </div>
    </section>

    <section id="dest-panel">
      <h2>Destination</h2>
      <div class="picker">
        <label>Shared drive
          <select id="drive-select"><option value="">Loading…</option></select>
        </label>
        <button id="refresh" title="Reload drive list">↻</button>
      </div>
      <div id="breadcrumb" class="breadcrumb"></div>
      <div class="new-folder-row">
        <button id="new-folder" class="ghost" disabled>+ New folder</button>
      </div>
      <div id="tree" class="tree"><p class="hint">Pick a shared drive to browse.</p></div>
    </section>
  </main>

  <footer>
    <button id="upload" disabled>Upload</button>
    <button id="cancel" class="ghost" hidden>Cancel</button>
    <div id="progress" class="progress" hidden></div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
